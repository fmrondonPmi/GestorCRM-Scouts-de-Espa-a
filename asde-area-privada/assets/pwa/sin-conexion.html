<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#632599">
<title>Sin conexión</title>
<style>
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; }
	body {
		display: flex; align-items: center; justify-content: center; text-align: center;
		padding: 24px; background: #fff; color: #444;
		font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
	}
	main { max-width: 420px; }
	.icono { width: 88px; height: 88px; margin: 0 auto 20px; display: block; }
	h1 { margin: 0 0 12px; font-size: 1.5rem; color: #632599; }
	p { margin: 0 0 12px; }
	.nota { font-size: .9rem; color: #555; }
	button {
		margin-top: 12px; padding: 12px 28px; border: 0; border-radius: 6px;
		background: #632599; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
	}
	button:focus-visible { outline: 3px solid #c7a2e8; outline-offset: 2px; }
</style>
</head>
<body>
<main>
	<svg class="icono" viewBox="0 0 100 100" role="img" aria-label="Tienda de campaña">
		<rect width="100" height="100" rx="22" fill="#632599"/>
		<polygon points="50,24 23,70 77,70" fill="#fff"/>
		<polygon points="50,46 40,70 60,70" fill="#632599"/>
		<rect x="16" y="70" width="68" height="4" fill="#c7a2e8"/>
	</svg>
	<h1>Sin conexión</h1>
	<p>No hay internet en este momento, y el área privada la necesita para mostrarte los datos del grupo.</p>
	<p class="nota">Por seguridad, las fichas, los pagos y los datos de los socios no se guardan en el móvil.</p>
	<button type="button" id="reintentar">Reintentar</button>
</main>
<script>
	document.getElementById( 'reintentar' ).addEventListener( 'click', function () { location.reload(); } );
	window.addEventListener( 'online', function () { location.reload(); } );
</script>
</body>
</html>
